name: Test, Build and Deploy Spring Backend

on: workflow_dispatch

jobs:
  build-deploy:
    name: Build and Deploy Spring Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: watchtemp_test
          POSTGRES_USER: watchtemp
          POSTGRES_PASSWORD: watchtemp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchtemp -d watchtemp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/watchtemp_test
      SPRING_DATASOURCE_USERNAME: watchtemp
      SPRING_DATASOURCE_PASSWORD: watchtemp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Test and Build Application
        run: mvn -B package --file pom.xml